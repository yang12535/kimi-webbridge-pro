name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and mock-daemon tests
        run: python -m unittest discover -s tests -v
      - name: Python and Bash syntax
        run: |
          python -m compileall -q skill/scripts
          bash -n skill/scripts/*.sh
      - name: ShellCheck
        run: shellcheck skill/scripts/*.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-platform unit and helper tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q skill/scripts
